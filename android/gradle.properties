org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true

# --- Настройки сборки Fasticamera (читаются в app/build.gradle.kts; в коде задач не хардкодятся) ---
# NDK — тот же, что у AGP; Rust-библиотека собирается под тот же API, что minSdk.
fasticamera.ndkVersion=30.0.16248370
fasticamera.rustPlatformApi=36
# Профиль Cargo и фичи для каждого типа сборки (профили описаны в корневом Cargo.toml).
fasticamera.cargoProfile.debug=android-debug
fasticamera.cargoProfile.release=release
fasticamera.cargoFeatures.debug=debug-scenarios
fasticamera.cargoFeatures.release=
# Фильтр логов по умолчанию (синтаксис tracing Targets). На один запуск переопределяется
# intent-параметром: adb shell am start ... -e log_filter "info,fasticamera::scenario=trace".
fasticamera.logFilter.debug=debug
fasticamera.logFilter.release=info
