# Cargo workspace Fasticamera. Карта crate-ов и владельцы состояния — user/foundation/README.md.
# Зонд tools/device-probe/native — отдельный проект со своим Cargo.lock, в workspace не входит.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

# Версии внешних зависимостей — в одном месте, crate-ы ссылаются через `workspace = true`.
[workspace.dependencies]
camera-contract = { path = "crates/camera-contract" }
camera-core = { path = "crates/camera-core" }
camera-ndk-sys = { path = "crates/camera-ndk-sys" }
camera-android = { path = "crates/camera-android" }
shell-contract = { path = "crates/shell-contract" }
android-shell = { path = "crates/android-shell" }
gpu-vulkan = { path = "crates/gpu-vulkan" }
render-loop = { path = "crates/render-loop" }
raw-frame-stream = { path = "crates/raw-frame-stream" }
isp-model = { path = "crates/isp-model" }
isp-vulkan = { path = "crates/isp-vulkan" }
scene-estimation = { path = "crates/scene-estimation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1.44"
# Только реестр и фильтр по целям: форматтеры fmt и regex-фильтр EnvFilter не нужны.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry"] }
jni = "0.22.4"
android_log-sys = "0.3.2"
# Чтение часов BOOTTIME/MONOTONIC для замера задержки «сенсор -> дисплей» (fasticamera-app).
libc = "0.2"
# Сырые биндинги NDK (rust-mobile). Только в android-shell; nativewindow — линковка libnativewindow
# (ANativeWindow_setFrameRate*). Тепловых функций в 0.6 нет — объявлены в android-shell сами.
ndk-sys = { version = "0.6.0", default-features = false, features = ["nativewindow"] }
# Vulkan (решение 7). `loaded` — libvulkan открывается в рантайме (Entry::load): нет линковки
# с libvulkan при сборке и честная ошибка, если Vulkan недоступен. `debug` — Debug для типов vk.
ash = { version = "0.38.0", default-features = false, features = ["loaded", "std", "debug"] }
# Генератор FFI-биндингов Camera2 NDK (решение 37). Только build-dependency crate-а camera-ndk-sys
# и только под Android: на хосте build.rs выходит сразу. `runtime` — libclang открывается в рантайме
# по пути из NDK (build-машине не нужен системный libclang); `logging` и `prettyplease` отключены:
# форматирование сгенерированного кода не нужно, а лишние зависимости — это лишняя поверхность.
bindgen = { version = "0.73.2", default-features = false, features = ["runtime"] }

[workspace.lints.rust]
# Каждая unsafe-операция внутри unsafe fn обязана стоять в явном unsafe-блоке с `// SAFETY:`.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# warn локально, ошибка в scripts/ci-checks.sh (-D warnings). В тестах разрешены через clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Профиль отладочного APK: быстрая сборка, полные символы, debug-assertions включены.
[profile.android-debug]
inherits = "dev"
opt-level = 1
debug = "full"
panic = "unwind"

# Профиль релизного APK. Символы (строки) остаются в .so: AGP вырезает их из APK
# и кладёт неурезанную копию рядом для ndk-stack (debugSymbolLevel = FULL в android/app).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
strip = "none"
# unwind, а не abort: паника ловится на границе JNI и превращается в отчёт (решение владельца, сессия 01).
panic = "unwind"
