# Политика размера модулей (ratchet). Читает и частично переписывает scripts/module-size-check.py.
# Правило проекта: файл около 700-800 строк — новую логику выносим в отдельный модуль.
schema_version = 1

# Мягкий предел: выше — предупреждение. Жёсткий предел: выше — ошибка (кроме legacy из baseline).
soft_limit_lines = 700
hard_limit_lines = 800

# Что сканировать (относительно --root). Отсутствующий каталог пропускается молча:
# crate-ы появляются постепенно.
roots = ["crates", "android", "scripts", "tools"]
extensions = [".rs", ".kt", ".kts", ".py", ".sh"]
exclude_dir_names = ["target", "build", ".gradle", ".git", ".kotlin", "__pycache__", "fixtures"]

# ВАЖНО: секция [baseline] ДОЛЖНА оставаться последней в файле.
# Скрипт при --update-baseline / --adopt переписывает файл от строки "[baseline]" до конца,
# всё выше сохраняется как есть.
# Формат: "путь/от/root" = разрешённое число строк. Число может только уменьшаться.
[baseline]
