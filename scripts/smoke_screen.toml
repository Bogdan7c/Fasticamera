# Пороги анализа скриншотов smoke-сценариев `raw-stream`, `raw-stream-endurance` и `viewfinder`
# (читает scripts/smoke_screen.py; менять здесь, а не в коде).
#
# Что за картинка. Видоискатель сессии 05 показывает RAW-мозаику камеры в ЛИНЕЙНЫХ ложных цветах,
# без баланса белого и гаммы: кадр тёмный и зеленоватый, средняя яркость в комнате — единицы-десятки
# уровней из 255. Поэтому пороги НИЗКИЕ, но НЕНУЛЕВЫЕ: чёрный экран (камера не рисуется) даёт
# яркость около нуля, а порог выше шума чёрного.
#
# Первые значения — оценка по физике, не по замеру. Если на телефоне честный прогон падает на пороге,
# смотрите числа в выводе скрипта и подкручивайте здесь: каждый скриншот и числа сохраняются в каталоге
# артефактов (вне репозитория).

[band]
# Центральная полоса кадра, доли высоты экрана. Верх закрыт статусной панелью системы и текстовой
# плашкой Kotlin с JSON сценария, низ — навигацией; берём строки с 30 % до 90 % высоты.
top_fraction = 0.30
bottom_fraction = 0.90
# Шаг выборки пикселей по ширине и высоте. 4 — каждый 16-й пиксель: хватает для среднего и разности,
# а чистый Python на 1440x3216 остаётся быстрым.
sample_step_pixels = 4

[thresholds]
# Средняя яркость полосы (шкала 0..255), ниже которой экран считается чёрным. Чёрный экран OLED даёт
# 0, шум сжатия и дизеринг — доли уровня; 2.0 заведомо выше.
min_mean_luminance = 2.0
# Средняя абсолютная разность яркости между двумя снимками (шкала 0..255), ниже которой картинка
# считается замершей. Живая сцена даёт шум сенсора (единицы уровней) и движение, замороженный кадр —
# ровно 0; 0.1 отделяет одно от другого с запасом.
min_mean_abs_difference = 0.1

# Проверка нейтральной карты сценария `viewfinder` (scripts/smoke_neutral_card.py). Включается только флагом
# `device-smoke.sh --neutral-card viewfinder`: владелец наводит телефон на серую карту, закрывающую центр кадра.
# Первые значения — оценка, не замер; подкручивать здесь по числам из вывода скрипта.
[neutral_card]
# Сторона квадратной области в центре экрана, доля меньшей стороны экрана (центр кадра, где лежит карта).
region_fraction = 0.2
# Допустимая относительная цветность (max - min) / среднее по средним R, G, B области. 0.08 — оттенок едва
# заметен глазу на сером; больше — баланс белого или цвет ISP увели серое.
max_relative_chroma = 0.08
# Средний уровень области (0..255), ниже которого карта считается неосвещённой: цветность там — шум.
min_mean_level = 20.0
# Уровень среднего серого. Карта на весь кадр после нашей AE обязана выйти на display_middle_gray тона
# (crates/isp-model/src/tone.rs, ToneCurveSettings::default().display_middle_gray; с 12b его переопределяет
# конфиг render.viewfinder.tone.display_middle_gray и intent-параметр tone_display_middle_gray) в ЛИНЕЙНОМ свете
# экрана. Если поменяли умолчание или запускаете с другим значением — поменять и здесь (Python крейты не читает).
# Допущение: скриншот 8-бит, кодирован передаточной функцией sRGB / Display P3 (у них она одна и та же);
# карта нейтральная (R≈G≈B), поэтому тег цветового пространства на уровень не влияет, важна только кривая.
display_middle_gray = 0.20
# Допустимая ошибка уровня в ступенях (EV) = |log2(Y_измеренная / display_middle_gray)|. 0.2 EV — около 15 %
# по свету, ~0.03 по закодированному значению. Первое значение — оценка, подкручивать по числам вывода.
max_middle_gray_error_ev = 0.2
# Коэффициенты яркости Y для линейных R, G, B Display P3 (строка Y матрицы P3-D65 → XYZ, белая точка D65;
# Apple / SMPTE EG 432-1). Сумма = 1: белый (1,1,1) даёт Y = 1.
p3_luminance_coefficients = [0.2290, 0.6917, 0.0793]

# Ровность поля: после полной коррекции затенения объектива (сессия 14f) плоская карта на весь кадр обязана
# выйти ровной, углы кадра совпадают с центром. Меряются четыре квадрата внутри кадра 4:3 видоискателя.
# Все числа ниже — первые значения: подкручивать по числам вывода на телефоне.
[neutral_card.flatness]
# Положение кадра 4:3 на экране, pt от верха экрана (раскладка «у нас», 440 pt по ширине, 1 pt = ширина_экрана_px / 440).
# Источник: docs/ios-camera/layout.md §4.3 «Кадр 4:3» (верх 186,0, низ 772,7) = тесты геометрии
# crates/camera-screen/src/layout_tests.rs. [measured: R00/C] + пересчёт на наш экран. Кадр занимает всю ширину экрана.
screen_width_pt = 440.0
frame_top_pt = 186.0
frame_bottom_pt = 772.7
# Отступ угловых квадратов от краёв кадра и их сторона, доли ШИРИНЫ кадра (оба по вертикали и по горизонтали).
# [estimate]: 0.05 (22 pt) уводит область от самого края кадра, а 0.08 (35 pt) даёт сотни пикселей на среднее.
# Что перекрывает кадр: ряд зума (центр y 736,6 pt, лента по центру по x) и квадрат фокуса (74,7 pt, только после
# тапа, вокруг точки тапа) — оба далеко от углов (углы в первых/последних 57 pt по x); значки над кадром, затвор и
# капсула режимов лежат вне кадра. Если на телефоне виден элемент в углу — увеличить отступ.
corner_inset_fraction = 0.05
corner_region_fraction = 0.08
# Допуск на один угол: |log2(Y_угла / Y_центра)| в ступенях (EV). [estimate]. Точность стендовой калибровки затенения
# на угол: основная камера ±0.05 EV, фронтальная ±0.1 EV, сверхширик ±0.25 EV; поэтому 0.25 EV — общий допуск
# под худший объектив. Скрипт не знает, какой объектив включён (сценарий `viewfinder` один), потому общий порог;
# если сверхширик будет проходить с запасом, а основная — нет, завести карту допусков по камерам.
max_corner_ev = 0.25
# Допуск на среднее |EV| по четырём углам. [estimate]: тоньше, чем на угол, — ловит равномерную недокоррекцию.
max_mean_ev = 0.15
