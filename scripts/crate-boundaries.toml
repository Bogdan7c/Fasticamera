# Правила границ между crate-ами Fasticamera.
# Читает scripts/check-crate-boundaries.py. Источник правил: user/foundation/README.md,
# разделы «Карта модулей», «Владельцы состояния», «Инварианты».
schema_version = 1

# Допустимые роли. Роль, которой нет в этом списке, — ошибка конфигурации (код 2).
roles = ["platform_neutral", "android_platform", "gpu", "output", "composition_root"]

# Роль каждого crate-а workspace. Будущие crate-ы из плана перечислены заранее:
# пока их нет в workspace, скрипт лишь сообщает о них информационной строкой.
# Новый crate в workspace без записи здесь — ошибка (код 1).
[crates]
"camera-contract" = "platform_neutral"
"shell-contract" = "platform_neutral"
"camera-core" = "platform_neutral"
"isp-model" = "platform_neutral"
"ui-core" = "platform_neutral"
"camera-screen" = "platform_neutral"
"camera-ndk-sys" = "android_platform"
"camera-android" = "android_platform"
"android-shell" = "android_platform"
"gpu-vulkan" = "gpu"
"render-loop" = "gpu"
"isp-vulkan" = "gpu"
"ui-render-vulkan" = "gpu"
"photo-output" = "output"
"fasticamera-app" = "composition_root"

# Поля правила:
#   applies_to          — роли, к которым правило применяется;
#   applies_to_crates   — конкретные crate-ы (можно вместе с applies_to);
#   forbid              — имена пакетов, которых не должно быть в транзитивных
#                         зависимостях (normal + build; dev не учитываются);
#   forbid_other_crates — true: дополнительно запрещены все остальные crate-ы из [crates];
#   reason              — объяснение, которое попадает в сообщение о нарушении.
#
# Правила по исходникам `[[source_rules]]` (проверяют .rs-файлы crate-а, а не граф зависимостей):
#   id            — имя правила;
#   crate         — crate из [crates]; (нет в workspace — правило пропускается);
#   pattern       — запрещённая подстрока (не regex); `//`-комментарии не считаются;
#   allowed_files — файлы относительно каталога crate-а (с «/»), где шаблон разрешён;
#   reason        — объяснение для сообщения.
# Неизвестный ключ в таблице — ошибка конфигурации (код 2).

[[rules]]
id = "jni-ndk-only-in-shell"
applies_to = ["platform_neutral", "gpu", "output"]
applies_to_crates = ["camera-ndk-sys", "camera-android"]
forbid = ["jni", "jni-sys", "ndk", "ndk-sys", "ndk-context"]
reason = "jni и ndk знают только android-shell и fasticamera-app, критерий выхода сессии 02 (шов Android ↔ Rust)"

[[rules]]
id = "neutral-no-platform"
applies_to = ["platform_neutral"]
forbid = [
  "ndk", "ndk-sys", "ndk-context", "jni", "jni-sys", "android_log-sys", "android_logger",
  "android-activity", "ash", "ash-window", "wgpu", "vulkano", "gpu-allocator",
  "camera-ndk-sys", "camera-android", "android-shell", "gpu-vulkan", "isp-vulkan",
  "ui-render-vulkan", "photo-output", "fasticamera-app",
]
reason = "платформенно-нейтральные ядра собираются и тестируются без телефона, README инвариант 5"

[[rules]]
id = "contract-is-leaf"
applies_to_crates = ["camera-contract", "shell-contract"]
forbid = []
forbid_other_crates = true
reason = "camera-contract и shell-contract — общие словари и не зависят от других crate-ов проекта, README «Карта модулей»"

[[rules]]
id = "ui-render-not-camera"
applies_to_crates = ["ui-render-vulkan"]
forbid = ["camera-core", "camera-android", "camera-ndk-sys", "camera-screen", "isp-vulkan", "isp-model"]
reason = "отрисовка UI не знает про камеру, фон стекла — нейтральный BackdropSource, README «Владельцы состояния»"

[[rules]]
id = "screen-no-camera2-no-draw"
applies_to_crates = ["camera-screen"]
forbid = ["camera-android", "camera-ndk-sys", "gpu-vulkan", "ui-render-vulkan", "isp-vulkan"]
reason = "экран камеры не вызывает Camera2 и не рисует сам, а отправляет намерения, README «Владельцы состояния»"

[[rules]]
id = "gpu-not-camera"
applies_to_crates = ["gpu-vulkan"]
forbid = [
  "camera-core", "camera-android", "camera-ndk-sys", "isp-model", "isp-vulkan",
  "ui-core", "ui-render-vulkan", "camera-screen",
]
reason = "gpu-vulkan не знает про камеру и алгоритмы, README «Владельцы состояния»"

[[rules]]
id = "render-loop-via-contracts"
applies_to_crates = ["render-loop"]
forbid = ["android-shell", "camera-android", "camera-ndk-sys", "camera-core", "camera-screen"]
reason = "поток рендера видит оболочку только через трейты shell-contract и не управляет камерой, решение 31"

[[rules]]
id = "camera-android-isolated"
applies_to_crates = ["camera-android"]
forbid = ["ash", "gpu-vulkan", "isp-model", "isp-vulkan", "ui-core", "ui-render-vulkan", "camera-screen"]
reason = "camera-android не знает про UI, Vulkan и ISP, README «Владельцы состояния»"

[[rules]]
id = "app-is-graph-leaf"
applies_to = ["platform_neutral", "android_platform", "gpu", "output", "composition_root"]
forbid = ["fasticamera-app"]
reason = "fasticamera-app — composition root и лист графа: от него никто не зависит, README «Карта модулей»"

[[source_rules]]
id = "gpu-ffi-only-in-safety-module"
crate = "gpu-vulkan"
pattern = 'extern "C"'
allowed_files = ["src/android/hardware_buffer_ffi.rs"]
reason = "функции NDK для AHardwareBuffer объявляются в одном safety-модуле, решение 32 сессии 03"

[[source_rules]]
id = "gpu-link-only-in-safety-module"
crate = "gpu-vulkan"
pattern = "#[link("
allowed_files = ["src/android/hardware_buffer_ffi.rs"]
reason = "линковка нативных библиотек — только в одном safety-модуле, решение 32 сессии 03"

[[source_rules]]
id = "camera-android-no-link-attribute"
crate = "camera-android"
pattern = "#[link("
allowed_files = []
reason = "линковка libcamera2ndk и libmediandk — только в camera-ndk-sys (build.rs), решение 37 сессии 04"

[[source_rules]]
id = "camera-android-callbacks-only-in-safety-modules"
crate = "camera-android"
pattern = 'extern "C"'
allowed_files = ["src/android/callbacks.rs", "src/android/reader_callback.rs"]
reason = "колбэки NDK объявляются только в двух safety-модулях (catch_unwind, без блокировок, события с поколением), сессия 04"

[[source_rules]]
id = "camera-ndk-sys-no-link-attribute"
crate = "camera-ndk-sys"
pattern = "#[link("
allowed_files = []
reason = "линковка объявляется в build.rs (cargo:rustc-link-lib) и только под Android; в исходниках атрибутов link нет, решение 37 сессии 04"

[[source_rules]]
id = "camera-ndk-sys-no-handwritten-extern"
crate = "camera-ndk-sys"
pattern = 'extern "C"'
allowed_files = []
reason = "объявления NDK генерирует bindgen при сборке; ручной extern в этом crate не нужен, решение 37 сессии 04"
