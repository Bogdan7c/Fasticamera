[package]
name = "render-loop"
description = "Поток рендера Fasticamera: владеет surface после маршрутизатора, тик по vsync, показ кадра (решение 31)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
still-contract.workspace = true
look-contract.workspace = true
# Только `vk::Extent2D` для размеров стенда V4 (`VideoHeadroomWorkload`, `OffscreenFrameSink`):
# вызовов Vulkan в render-loop нет, всё через gpu-vulkan/isp-vulkan.
ash.workspace = true
camera-contract.workspace = true
gpu-vulkan.workspace = true
# ISP видоискателя на GPU (сессия 07): слитый compute-проход RAW → изображение видоискателя.
isp-vulkan.workspace = true
# Параметры ISP на кадр (`IspParams::resolve` из паспорта и подсказок кадра) и статистика AWB.
isp-model.workspace = true
# Только `clock_gettime(CLOCK_MONOTONIC)` в safety-модуле `thread/monotonic_clock.rs` (план позднего захвата).
libc.workspace = true
# Оценка света сцены (AWB, сессия 08): таблица локуса камеры, оценщик, сглаживание; нейтральный crate.
scene-estimation.workspace = true
raw-frame-stream.workspace = true
shell-contract.workspace = true
# Рисование UI и стекла поверх живого видоискателя (сессия 11): источник кадра UI (`UiFrameSource`),
# GPU-рендер (`UiRenderer`) и правило масштаба pt (`PointScaleRule`, решение 82) — чтобы `px_per_pt` не был константой в коде.
ui-core.workspace = true
ui-draw.workspace = true
ui-render-vulkan.workspace = true
# Словарь и эталон цветовых приборов (14h): намерение экрана, правило прибора для `ColorScopes`, настройки модели.
scope-contract.workspace = true
scope-model.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# Швы отказов бэкенда для тестов (пробрасывается в gpu-vulkan). В боевые сборки НЕ включается.
fault-injection = ["gpu-vulkan/fault-injection"]
# Тестовые швы чтения (readback изображения видоискателя в функциональных тестах). В боевые сборки НЕ включается.
# (пробрасывается и в ui-render-vulkan: без неё его тестовый шейдер в сборке остаётся неиспользованной константой).
test-support = ["gpu-vulkan/test-support", "ui-render-vulkan/test-support", "isp-vulkan/test-support"]

[dev-dependencies]
camera-contract = { workspace = true, features = ["fixtures"] }
# Синтетические RAW-источники на обычной памяти Vulkan для функционального теста показа кадров камеры на ПК.
gpu-vulkan = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
# Подделка службы ADPF для тестов отчётов потока рендера.
shell-contract = { workspace = true, features = ["fake-performance-hints"] }
# Интеграционные тесты потока включают швы отказов через самого себя.
render-loop = { path = ".", features = ["fault-injection", "test-support"] }

[lints]
workspace = true
