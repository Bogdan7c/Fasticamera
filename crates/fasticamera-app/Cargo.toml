[package]
name = "fasticamera-app"
description = "Composition root Fasticamera: нативная библиотека приложения, точка входа JNI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Имя .so: libfasticamera.so, Kotlin грузит его через System.loadLibrary("fasticamera").
name = "fasticamera"
# cdylib — для APK; rlib — чтобы host-тесты линковались с библиотекой.
crate-type = ["cdylib", "rlib"]

[features]
# Отладочные сценарии (например, намеренная паника). Включает только debug-вариант APK
# (android/gradle.properties: fasticamera.cargoFeatures.debug), в release их нет физически.
debug-scenarios = []

[dependencies]
android-shell.workspace = true
camera-android.workspace = true
camera-contract.workspace = true
camera-core.workspace = true
# Экран камеры (сессия 12): «мозг» и фасад `CameraScreen`; приложение только собирает его и исполняет эффекты.
camera-screen.workspace = true
gpu-vulkan.workspace = true
isp-vulkan.workspace = true
# Служба записи снимков (сессия 14): допуск, DNG/Exif, MediaStore; приложение только подключает её.
photo-output.workspace = true
raw-frame-stream.workspace = true
render-loop.workspace = true
shell-contract.workspace = true
# Словарь снимка: план, события проявления, фазы.
still-contract.workspace = true
look-contract.workspace = true
look-presets.workspace = true
# Демо-сцена стекла (сессия 11): сцена, элементы и словарь рисования.
ui-core.workspace = true
ui-draw.workspace = true
ui-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Fake-бэкенд движка и образцы камер OnePlus 11: функциональные тесты сервиса камеры и сценариев.
camera-contract = { workspace = true, features = ["fixtures"] }
camera-core = { workspace = true, features = ["fake-backend"] }
# Подставной источник батареи: функциональные тесты сценариев замера тока (сессия 07).
shell-contract = { workspace = true, features = ["fake-power-source"] }
# Golden-кадры экрана камеры (сессия 12): настоящий рендер UI на GPU ПК поверх синтетического фона.
# `camera-screen` GPU-crate-ы не видит (guardrail), поэтому сшивка экрана с `UiRenderer` — здесь, в composition root.
ash.workspace = true
gpu-vulkan = { workspace = true, features = ["test-support"] }
ui-render-vulkan = { workspace = true, features = ["test-support"] }
# Сквозной тест вида (14a): настоящий бэкенд показа на ПК с подставной камерой (стенд `render-loop/tests/viewfinder_rig`)
# и эталон `isp-model`; readback изображения видоискателя включает `test-support` render-loop.
isp-model.workspace = true
render-loop = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
android_log-sys.workspace = true

[lints]
workspace = true
