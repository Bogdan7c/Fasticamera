[package]
name = "isp-vulkan"
description = "ISP Fasticamera на GPU (Vulkan compute): видоискатель из RAW (паритет с isp-model Preview) и качественный конвейер полного кадра"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Шейдеры (GLSL) компилируются в build.rs той же логикой, что у gpu-vulkan (решение 33).
build = "build.rs"

[dependencies]
ash.workspace = true
camera-contract.workspace = true
gpu-vulkan.workspace = true
isp-model.workspace = true
# Словарь снимка: хранилище пикселей `PixelStorage`, `RawSamples16`, `Rgba8Image` (сессия 14, пакет P3).
still-contract.workspace = true
# Цветовые приборы (14h): словарь (размер картинки) и CPU-эталон (правила, сетки, показ), с которым GPU сверяется.
scope-contract.workspace = true
scope-model.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Свой же crate с фичей test-support: чтение счётчиков и картинки приборов в тестах (как у gpu-vulkan).
isp-vulkan = { path = ".", features = ["test-support"] }
camera-contract = { workspace = true, features = ["fixtures"] }
# Синтетические RAW-источники, readback и одноразовые сабмиты для ПК-тестов паритета.
gpu-vulkan = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
# Значения ручек вида для тестов цвета вида и таблицы (словарь без логики; в нормальные зависимости не входит).
look-contract.workspace = true

[features]
# Блокирующее чтение счётчиков и картинки приборов (`scopes::test_support`) для ПК-тестов. В боевые сборки НЕ включается.
test-support = ["gpu-vulkan/test-support"]

[lints]
workspace = true
